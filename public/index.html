<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unlogic Games</title>
    <meta name="description" content="Independent game studio crafting original premium single-player narrative, RPG & strategy games. Based in Miami and Madrid.">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/fav.png">
    <link rel="apple-touch-icon" href="assets/fav.png">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-EL40F27VS8"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-EL40F27VS8');
</script>

    <!-- External dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

    <!-- Site styles -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ui.css">
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P3KTFHQM"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

    <!-- Canvas for rendering Logo and Game -->
    <canvas id="gameCanvas"></canvas>

    <!-- Capa de UI Inicial -->
    <div id="ui-layer"
        class="fade-transition absolute inset-0 flex flex-col justify-between items-center py-8 sm:py-16 pointer-events-none">

        <!-- Logo estático -->
        <div class="text-center mt-4 sm:mt-8 px-8 w-full">
            <img src="assets/horizontal.png" alt="Logo Games" class="w-full max-w-[224px] mx-auto logo-glow">
        </div>

        <!-- Instrucciones + CTA -->
        <div class="flex flex-col items-center w-full mb-4 sm:mb-8">

            <!-- Móvil: instrucción portrait -->
            <div class="show-portrait flex-col items-center mb-6 sm:mb-10 px-6">
                <svg class="w-10 h-10 text-white text-glow mb-3 sm:mb-4 animate-tilt" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
                <h2
                    class="text-xs md:text-sm font-bold tracking-widest text-white/90 text-glow text-center max-w-xs leading-relaxed">
                    BIG THINGS ARE COMING.<br>FOR NOW, ROTATE YOUR PHONE
                </h2>
            </div>

            <!-- Desktop: instrucción landscape -->
            <div id="desktop-start-btn"
                class="show-landscape flex-col items-center mb-6 sm:mb-10 px-6 cursor-pointer pointer-events-auto transition-transform">
                <svg class="w-10 h-10 text-white text-glow mb-3 sm:mb-4 animate-bounce" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <rect x="7" y="4" width="10" height="16" rx="5" stroke-width="1.5"></rect>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v3"></path>
                </svg>
                <h2
                    class="text-xs md:text-sm font-bold tracking-widest text-white text-glow text-center max-w-xs leading-relaxed">
                    BIG THINGS ARE COMING.<br>FOR NOW, SCROLL DOWN
                </h2>
            </div>

            <!-- CTA -->
            <div class="pointer-events-auto">
                <a href="https://unlogicgames.substack.com/subscribe" target="_blank" rel="noopener noreferrer"
                    class="btn-glow inline-block bg-white text-black px-8 py-3 md:px-10 md:py-4 rounded-full font-bold uppercase tracking-widest text-xs md:text-sm active:scale-95 transition-all">
                    Stay in the loop
                </a>
            </div>

            <!-- About Us trigger -->
            <div class="pointer-events-auto mt-4">
                <button id="about-btn" onclick="openCredits()"
                    class="text-white/40 hover:text-white/80 font-bold uppercase tracking-widest text-[10px] transition-all cursor-pointer">
                    About Us
                </button>
            </div>
        </div>
    </div>

    <!-- Capa de Puntuación -->
    <div id="score-layer"
        class="fade-transition absolute inset-0 flex justify-center items-center pointer-events-none opacity-0 z-10">

        <button id="back-btn"
            class="absolute top-6 sm:top-8 left-1/2 -translate-x-1/2 text-white/50 hover:text-white pointer-events-auto font-bold tracking-widest text-xs flex items-center gap-2 transition-all hover:scale-105 active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
                </path>
            </svg>
            BACK
        </button>

        <!-- Pong -->
        <div id="pong-scores" class="text-[20vw] font-black text-white/5 flex w-full justify-between px-20 select-none">
            <span id="score-user">0</span>
            <span id="score-ai">0</span>
        </div>
        <div id="pong-info"
            class="absolute top-6 left-1/2 -translate-x-1/2 text-white/30 font-bold tracking-widest text-xs select-none z-10"
            style="display:none;">
            <span id="pong-level">LVL 1</span> &nbsp;&middot;&nbsp; <span id="pong-total">0</span> PTS
        </div>

        <!-- Arkanoid -->
        <div id="arkanoid-scores" class="text-[20vw] font-black text-white/5 flex w-full justify-center select-none"
            style="display:none;">
            <span id="score-arkanoid">0</span>
        </div>
        <div id="arkanoid-info"
            class="absolute top-6 left-1/2 -translate-x-1/2 text-white/30 font-bold tracking-widest text-xs select-none z-10"
            style="display:none;">
            <span id="ark-level">LVL 1</span> &nbsp;&middot;&nbsp; <span id="ark-total">0</span> PTS
        </div>

        <!-- Space Invaders -->
        <div id="invaders-scores" class="text-[20vw] font-black text-white/5 flex w-full justify-center select-none"
            style="display:none;">
            <span id="score-invaders">0</span>
        </div>
        <div id="invaders-info"
            class="absolute top-6 left-1/2 -translate-x-1/2 text-white/30 font-bold tracking-widest text-xs select-none z-10"
            style="display:none;">
            <span id="inv-level">LVL 1</span> &nbsp;&middot;&nbsp; <span id="inv-total">0</span> PTS
        </div>

        <!-- Snake -->
        <div id="snake-scores" class="text-[20vw] font-black text-white/5 flex w-full justify-center select-none"
            style="display:none;">
            <span id="score-snake">0</span>
        </div>
        <div id="snake-info"
            class="absolute top-6 left-1/2 -translate-x-1/2 text-white/30 font-bold tracking-widest text-xs select-none z-10"
            style="display:none;">
            <span id="snake-total">0</span> PTS
        </div>
    </div>

    <!-- Credits overlay (ending titles) -->
    <div id="credits-overlay" style="display:none; opacity:0; transition:opacity 0.5s ease;"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black cursor-pointer">
        <canvas id="credits-canvas" class="absolute inset-0"></canvas>
    </div>

    <!-- MIDI playback library (credits music) -->
    <script src="https://cdn.jsdelivr.net/npm/jzz"></script>
    <script src="https://cdn.jsdelivr.net/npm/jzz-midi-smf"></script>
    <script src="https://cdn.jsdelivr.net/npm/jzz-synth-tiny"></script>

    <!-- JS: load order matters — each file relies on globals from previous ones -->
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/highscores.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/render.js"></script>
    <script src="js/games/pong.js"></script>
    <script src="js/games/arkanoid.js"></script>
    <script src="js/games/invaders.js"></script>
    <script src="js/games/snake.js"></script>
    <script src="js/gameover.js"></script>
    <script src="js/transitions.js"></script>
    <script src="js/credits.js"></script>
    <script src="js/input.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
