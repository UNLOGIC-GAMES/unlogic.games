dossier:
  url: assets/steamdreams-friends-and-family-dossier.pdf
  cta: Download the Friends & Family dossier

lead:
  title: Everything may shift in transit.
  title_a: Everything may
  title_b: shift
  title_c: in transit.
  video_badge: In-engine · WIP
  video_caption: Same workshop. A different story for every player.
  copy: A steampunk workshop run by three goblin siblings, where every character, order and headline reacts to you, thanks to an AI running directly on your machine. No servers. No subscription. Nobody else will live your story.
  trailer: See how a job goes

bench:
  heading: Same bench. Never the same workshop.
  deck: In the workshop, building is choosing. How you handle each job says who you are, and Lightower is paying attention.
  steps:
    - name: The order
      text: Someone knocks with a broken steambot. Take the job, or send them away.
      image: bench/step-1.webp
    - name: The build
      text: Do what they asked, or what you think they need. They'll remember which.
      image: bench/step-2.webp
    - name: The deadline
      text: Rush it tonight or do it right tomorrow. The queue at the door is watching.
      image: bench/step-3.webp
    - name: The delivery
      text: Hand it over and see what comes back. By morning, the city knows how you work.
      image: bench/step-4.webp

choose:
  heading: What happens when you choose?
  deck: In a regular narrative game, the answer was already written. In SteamDreams it gets written on your PC, right then.
  hand:
    label: Hand-written only
    title: You pick between paths that already exist
    stamp: The end
    items:
      - Writers prepare every possible answer in advance
      - If two players choose the same thing, they see the same scene
      - Once you've seen it all, the story is over
  local:
    label: Hand-written + local AI
    title: Your choice opens a new path
    count: scenes in this run, and counting
    items:
      - Our team writes the world, the characters, the main plot and the endings
      - "Everything in between (dialogue, orders, consequences and headlines) is improvised inside that world by the local AI"
      - Characters remember what you did. No two players get the same run

world:
  heading: A living world. No live service.
  does_title: The local AI does
  does_lead: The local AI
  does_word: does
  does:
    - Improvise what characters say, in character
    - Remember your choices and bring them back later
    - Create orders and customers based on how your workshop is doing
    - Write your own Lightower Gazette
  never_title: The local AI doesn't
  never_lead: The local AI
  never_word: doesn't
  never:
    - Generate the art, the characters or the environments
    - "Replace our writers: it improvises inside their world"
    - Send your playthrough to any server
    - Ask for a connection, an account or a subscription

gazette:
  heading: You choose. Lightower remembers.
  loop:
    - You take an order. Or you turn it down.
    - The siblings remember how you handled it.
    - The city shifts in transit.
    - Your Gazette reports it the next morning.
  kicker: Your edition. Nobody else gets it.
  edition: Edition
  desk: Today at the workshop
  try: Pick one and read tomorrow's paper.
  note: In the game, the local AI writes each edition from what you did. On this page, our writers wrote these three.
  story:
    ask: A very nervous stranger knocks at midnight with a steambot that has swallowed a pocket watch.
    intro:
      headline: STEAMDREAMS OPENS ITS DOORS. LIGHTOWER HOLDS ITS BREATH.
      body: Three goblin siblings have taken over the old workshop on the canal. Neighbours report steam, shouting and, once, applause.
      quote: "TINKEL: “We’re open. Mostly.”"
    options:
      - choice: Fix it that same night
        headline: WORKSHOP FIXES STEAMBOT AT MIDNIGHT. QUEUE REACHES THE CANAL.
        body: By morning, half the street had found something broken at home. Rival workshops call it unfair competition.
        quote: "VEXOR: “Generosity doesn’t pay for coal.”"
      - choice: Charge double
        headline: STEAMDREAMS DISCOVERS THE NIGHT RATE.
        body: The stranger paid without a word and left faster than he came. The Gazette has received eleven letters about it.
        quote: "VEXOR: “Finally, someone here understands business.”"
      - choice: Let Vexor “improve” it
        headline: STEAMBOT NOW CHIMES EVERY HOUR. LOUDLY.
        body: Vexor fitted a module nobody asked for. The watch is still inside. The owner has asked for a second opinion.
        quote: "TINKEL: “I said no. I said no in writing.”"

made:
  heading: Everything you see was made by people.
  copy: Concept art, characters, story, music, 3D, UI… everything is made by our team. The local AI only rewords and enhances our narrative.

close:
  label: The workshop keeps going
  copy: If you want Lightower to exist, support us on Kickstarter.
  ai_note: SteamDreams uses a language model that runs on your PC for dialogue, character memory and the Gazette. All art is made by our artists. Your playthroughs never leave your machine.

welcome:
  heading: Welcome to Steam Dreams
  copy:
    - text: >
        A new day dawns in Steamdreams. You are Vexor, one of three sibling
        owners of SteamDreams, a new Steambots workshop aspiring to be the
        best in Lightower City. You'll have to cater to eccentric customers,
        take care of your employees, suppliers, and much more.
    - text: >
        Talking to everyone and exploring the workshop, you'll discover
        hints and facts that can take your life down very different paths.
        So choose your words with care.
    - text: "…one more thing… Everyone can be nice, or a complete bastard. Including you."

