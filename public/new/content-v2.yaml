  day_alt: The goblins' workshop by day, sun through the arched windows
  night_alt: The same workshop at night, lit by its own lamps
  scene_alt: Vexor offers a new module he just made while Tinkel fights with a steambot at the bench

dividers:
  office_alt: A Lightower office, brass fittings and papers in warm lamplight
  workshop_alt: The SteamDreams workshop floor, stations and hanging steam

features:
  heading: Connect with a whole world in offline mode
  items:
    - title: A full world alive offline
      image: workshop-lead.jpg
      text: The shop, the staff and the city keep moving without ever needing a server. Characters talk with their own personality and answer you in real time, powered by our Dynamic Narrative Assembler, a set of systems, including a fine-tuned local AI, that runs entirely on your device.
    - title: Lead the Workshop
      image: workshop-lead-punch.jpg
      ratio: 1024 / 431
      text: "Run the daily shop: choose builds and jobs, negotiate suppliers, manage and train workers, and upgrade the workshop. Coordinate multi-step steambot work across stations, then balance the day cycle of crafting, repairs, customer tasks, cleanup, minigames, and stamina/resources."
    - title: Every word counts
      images:
        - battle.jpg
        - battle-dialogue.jpg
        - battle-choice.jpg
      text: "Every line you choose moves something. What you say to a customer, a supplier or your own siblings sets the price of the job, the trust between you and how they greet you tomorrow. Say it kindly or say it sharply: people in Lightower remember what you said, and they answer in kind."

