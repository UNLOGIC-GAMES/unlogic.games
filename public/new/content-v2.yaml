positioning:
  heading: Not another indie game
  items:
    - label: Genre
      text: Top-Down workshop-management & business sim fused with an emergent, systemic narrative RPG.
    - label: Pitch in a line
      text: "*RimWorld* meets *Cult of the Lamb* — cozy, characterful, and systemically deep."
    - label: Experience
      text: You play one of three goblin siblings who open a steambot repair-and-build workshop in the bustling, psycho-alchemical metropolis of Lightower City. Craft, repair, manage a crew of goblins and steambots, build relationships, and climb the city’s Popularity Ranking — with stories that emerge from systems rather than scripted trees.

timing:
  heading: When and where
  items:
    - label: Studio launch
      text: Unlogic Games launched publicly in May 2026.
    - label: Next milestone
      text: A public-facing vertical slice / demo targeting Gamescom 2026.
    - label: Distribution
      text: PC-first launch on Steam, with console releases to follow as part of this partner program.
    - label: Market position
      text: A premium, single-player, offline title in the cozy-management + narrative space, differentiated by proprietary emergent-narrative technology.

audience:
  heading: For players and goblins
  items:
    - label: Core
      text: "Fans of colony / management & cozy sims — *RimWorld*, *Cult of the Lamb*, *Stardew Valley*, *Spiritfarer*, *Two Point* series."
    - label: Secondary
      text: Narrative-RPG and systemic-storytelling enthusiasts who value replayable, emergent stories.
    - label: Tertiary
      text: Steampunk and stylized-fantasy fans drawn to a distinctive painterly art world.
    - label: Profile
      text: Players who prefer thoughtful, single-player, offline experiences over live-service; comfortable on both PC and console.

platforms:
  items:
    - label: PlayStation
      text: PS5 and next-gen PlayStation.
    - label: Xbox
      text: Xbox Series X|S and next-gen Xbox.
    - label: Nintendo
      text: Switch 2.
    - label: PC
      text: "Windows, macOS, and Linux (distributed via Steam)."
    - label: "Engine & tech"
      text: Unreal Engine 5.7 with a dedicated C++ core. A proprietary on-device AI subsystem powers narrative locally, fully offline — no server dependency for players.
